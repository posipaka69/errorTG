:root{
  color-scheme:dark;
  --bg:#121212;--text:#e8e8e8;--hint:#8b8b90;
  --btn:#e5484d;--btnt:#fff;--sec:#1c1c1e;--line:#2a2a2c;--red:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:15px;margin:18px 0 8px;color:var(--hint);font-weight:600}
.card{background:var(--sec);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.total{text-align:center;padding:24px 14px}
.total b{display:block;font-size:56px;line-height:1.1}
.total span{color:var(--hint);font-size:14px}
.row{display:flex;gap:10px}.row .card{flex:1;min-width:0}
.mini small{color:var(--hint);display:block;font-size:12px;margin-bottom:6px}
.mini .n{font-size:26px;font-weight:700}
.mini .tg{font-size:13px;color:var(--btn);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-weight:600}.sb{font-size:13px;color:var(--hint)}
.badge{background:var(--red);color:#fff;border-radius:20px;padding:3px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.badge.z{background:var(--line);color:var(--hint)}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.btn{background:var(--btn);color:var(--btnt);width:100%;font-weight:600;margin-top:6px}
.btn.red{background:var(--red);color:#fff}.btn.gray{background:var(--line);color:var(--text)}
.x{background:none;color:var(--red);padding:4px 8px;font-size:18px}
.ed{background:none;color:var(--hint);padding:4px 8px;font-size:18px}
.acts{display:flex;align-items:center}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:8px}
nav{display:flex;background:var(--sec);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--hint);font-size:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--btn)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar div{height:100%;background:var(--red);border-radius:4px}
.back{background:none;color:var(--btn);padding:0 0 10px;font-weight:600}
.empty{text-align:center;color:var(--hint);padding:24px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--sec);border:1px solid var(--line);color:var(--text);padding:8px 12px;font-size:13px;border-radius:20px}
.chip.on{background:var(--btn);color:var(--btnt)}
.dates{display:flex;gap:8px}.dates label{flex:1;font-size:12px;color:var(--hint)}
.dates input{margin:4px 0 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
#modal.show{display:flex}
#mbox{background:var(--sec);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
#mbox h3{margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20;text-align:center;max-width:90%}
</style>

function detectLang(){

/* ---------- Хранилище: Telegram CloudStorage (fallback: localStorage) ---------- */
const CS = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const store = {
  get(keys){return new Promise(res=>{
    if(!keys.length) return res({});
    if(CS) CS.getItems(keys,(e,v)=>res(e?{}:v||{}));
    else{const o={};keys.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)o[k]=v});res(o)}
  })},
  set(k,v){return new Promise(res=>{ if(CS) CS.setItem(k,v,()=>res()); else{localStorage.setItem(k,v);res()} })},
  del(k){return new Promise(res=>{ if(CS) CS.removeItem(k,()=>res()); else{localStorage.removeItem(k);res()} })}
};

const tname = id => { const t=types.find(x=>x.id===id); return t?t.name:L('deleted_type') };
const total = p => errs.reduce((a,e)=>a+(e.p===p.id?1:0),0);
function fmtD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fmtDT = ts => new Date(ts).toLocaleString(LOC(),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});


/* ---------- Работа с общей базой ---------- */
async function api(path,opts){
  opts=opts||{};
  const auth = SUPABASE_KEY.startsWith('eyJ') ? {Authorization:'Bearer '+SUPABASE_KEY} : {};
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:Object.assign({apikey:SUPABASE_KEY,'x-team':team,'Content-Type':'application/json',Prefer:'return=minimal'},auth,opts.headers||{}),
    body:opts.body
  });
  if(!r.ok) throw new Error(r.status+' '+await r.text());
  return (opts.method&&opts.method!=='GET') ? null : r.json();
}
async function fetchAll(table,select,order){
  const out=[]; let off=0;
  for(;;){
    const rows=await api(table+'?select='+select+'&order='+order+'&limit=1000&offset='+off);
    out.push(...rows); if(rows.length<1000)break; off+=1000;
  }
  return out;
}
async function refresh(){
  if(!team||!SUPABASE_URL||!SUPABASE_KEY||busy)return;
  busy=true; const gen=mutGen;
  try{
    const [ty,pe,er]=await Promise.all([
      fetchAll('types','id,name','created_at.asc,id.asc'),
      fetchAll('people','id,sur,nm,pat,ini,phone,tg','created_at.asc,id.asc'),
      fetchAll('errs','id,p,t,ts','ts.asc,id.asc')
    ]);
    if(gen!==mutGen||pending>0)return;
    const ns=JSON.stringify([ty,pe,er]);
    status='ok';
    if(ns!==sig||!loadedOnce){sig=ns; types=ty; people=pe; errs=er; loadedOnce=true; render()}
  }catch(e){
    console.error(e);
    if(!loadedOnce){status='error'; render()}
  }finally{busy=false}
}
async function mutate(fn){
  pending++; mutGen++;
  let ok=true;
  try{await fn()}catch(e){ok=false;console.error(e);toast(L('save_error'))}
  finally{pending--}
  if(!ok){sig='';await refresh()} else {sig=JSON.stringify([types,people,errs])}
  return ok;
}
const q = id => encodeURIComponent(id);
function actorName(){
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user; if(!u)return '';
  return [u.first_name,u.last_name].filter(Boolean).join(' ')+(u.username?' (@'+u.username+')':'');
}
function logAct(act,d){
  const row={id:uid(),ts:Date.now(),who:actorName(),act,d:JSON.stringify(d||{})};
  api('log',{method:'POST',body:JSON.stringify(row)}).catch(e=>console.error('log',e));
}
async function openLog(){
  showLog=true; logRows=null; logStatus='loading'; render();
  try{ logRows=await api('log?select=id,ts,who,act,d&order=ts.desc&limit=200'); logStatus='ok' }
  catch(e){ console.error(e); logStatus='error' }
  render();
}
function closeLog(){ showLog=false; render() }
function logText(r){
  let d={}; try{d=JSON.parse(r.d)||{}}catch{}
  const j=a=>a.filter(Boolean).join(' · ');
  switch(r.act){
    case 'err_add': return (d.picker||'')+' — '+(d.type||'');
    case 'err_del': return j([(d.picker||'')+' — '+(d.type||''), d.ts?fmtDT(d.ts):'']);
    case 'type_add': case 'type_del': return d.name||'';
    case 'type_edit': return (d.from||'')+' → '+(d.to||'');
    case 'person_add': return d.name||'';
    case 'person_edit': return j([d.name, ...Object.keys(d.ch||{}).map(k=>L('log_f_'+k)+': '+((d.ch[k][0])||'—')+' → '+((d.ch[k][1])||'—'))]);
    case 'person_del': return (d.name||'')+(d.n?' ('+L('log_errs_n')+': '+d.n+')':'');
  }
  return '';
}
function logView(){
  const head=`<button class="back" onclick="closeLog()">${L('back')}</button><h1>${L('log_title')}</h1>`;
  if(logStatus==='loading') return head+`<div class="empty">${L('loading')}</div>`;
  if(logStatus==='error') return head+`<div class="card sb" style="color:var(--text)">${L('load_error')}</div><button class="btn" onclick="openLog()">${L('retry')}</button>`;
  if(!logRows||!logRows.length) return head+`<div class="empty">${L('log_empty')}</div>`;
  return head+logRows.map(r=>`<div class="card"><div class="nm">${esc(L('log_'+r.act))}</div><div style="margin:4px 0;word-break:break-word">${esc(logText(r))}</div><div class="sb">${esc(r.who||L('log_unknown'))} · ${fmtDT(r.ts)}</div></div>`).join('');
}

}

function monthErrs(){
  const d=new Date();
  const a=new Date(d.getFullYear(),d.getMonth(),1).getTime(), b=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
  return errs.filter(e=>e.ts>=a&&e.ts<b);
}
function home(){
  const list=monthErrs();
  const cnt=p=>list.filter(e=>e.p===p.id).length;
  let mx=null,mn=null;
  people.forEach(p=>{ if(!mx||cnt(p)>cnt(mx))mx=p; if(!mn||cnt(p)<cnt(mn))mn=p });
  const box=(label,p)=>`<div class="card mini"><small>${label}</small>${p?`<div class="n">${cnt(p)}</div><div class="tg">${esc(nick(p.tg))}</div><div class="sb">${esc(pname(p))}</div>`:`<div class="n">—</div>`}</div>`;

/* ----- Статистика ----- */
function range(){
  const a = per.from? new Date(per.from+'T00:00:00').getTime() : -Infinity;
  const b = per.to? new Date(per.to+'T23:59:59.999').getTime() : Infinity;
  return errs.filter(e=>e.ts>=a&&e.ts<=b);
}
function setPreset(k){
  const d=new Date(), t=fmtD(d);
  if(k==='today') per={from:t,to:t};
  else if(k==='week') per={from:fmtD(new Date(d.getFullYear(),d.getMonth(),d.getDate()-6)),to:t};
  else if(k==='month') per={from:fmtD(new Date(d.getFullYear(),d.getMonth(),1)),to:t};
  else per={from:'',to:''};
  sel={p:null,t:null}; render();
}
function setDate(k,v){per[k]=v;sel={p:null,t:null};render()}
function presetOn(k){
  const d=new Date(), t=fmtD(d);
  if(k==='today')return per.from===t&&per.to===t;
  if(k==='week')return per.from===fmtD(new Date(d.getFullYear(),d.getMonth(),d.getDate()-6))&&per.to===t;
  if(k==='month')return per.from===fmtD(new Date(d.getFullYear(),d.getMonth(),1))&&per.to===t;
  return !per.from&&!per.to;
}
function fmtIso(iso){return new Date(iso+'T00:00:00').toLocaleDateString(LOC(),{day:'2-digit',month:'2-digit',year:'numeric'})}
function periodLabel(){
  if(!per.from&&!per.to) return L('all_time');
  if(per.from&&per.from===per.to) return fmtIso(per.from);
  return (per.from?fmtIso(per.from):'…')+' — '+(per.to?fmtIso(per.to):'…');
}

function stats(){
  const list=range();
  const controls = `<h1>${L('stats_title')}</h1>
  <div class="chips">${[['today',L('today')],['week',L('d7')],['month',L('month')],['all',L('all_time')]].map(([k,l])=>`<button class="chip ${presetOn(k)?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}</div>
  <div class="dates"><label>${L('from')}<input type="date" value="${per.from}" onchange="setDate('from',this.value)"></label><label>${L('to')}<input type="date" value="${per.to}" onchange="setDate('to',this.value)"></label></div>`;

  // уровень 2: время ошибок
  if(sel.p && sel.t){
    const p=people.find(x=>x.id===sel.p);
    const rows=list.filter(e=>e.p===sel.p&&e.t===sel.t).reverse();
    return controls+`<button class="back" onclick="sel.t=null;render()">${L('back')}</button>
    <div class="card"><div class="nm">${esc(p?pname(p):'')}</div><div class="sb">${esc(tname(sel.t))} · ${rows.length}</div></div>
    ${rows.map(e=>`<div class="card item"><span>${fmtDT(e.ts)}</span><button class="x" onclick="delErr('${e.id}')">✕</button></div>`).join('')||`<div class="empty">${L('no_errs')}</div>`}`;
  }
  // уровень 1: типы у человека
  if(sel.p){
    const p=people.find(x=>x.id===sel.p);
    const mine=list.filter(e=>e.p===sel.p), cnt={};
    mine.forEach(e=>cnt[e.t]=(cnt[e.t]||0)+1);
    return controls+`<button class="back" onclick="sel.p=null;render()">${L('back')}</button>
    <div class="card item"><span class="nm">${esc(p?pname(p):'')}</span><span class="badge">${mine.length}</span></div>
    ${Object.keys(cnt).map(t=>`<div class="card item" onclick="sel.t='${t}';render()"><span>${esc(tname(t))}</span><b>${cnt[t]} ›</b></div>`).join('')||`<div class="empty">${L('no_errs_period')}</div>`}`;
  }
  // уровень 0: люди
  const rows=people.map(p=>({p,c:list.filter(e=>e.p===p.id).length})).filter(r=>r.c>0).sort((a,b)=>b.c-a.c);
  const mx=Math.max(1,...rows.map(r=>r.c));
  return controls+`<div class="card item" style="margin-top:12px"><span>${L('total_period')}</span><b>${list.length}</b></div>
  ${rows.map(r=>`<div class="card" onclick="sel.p='${r.p.id}';render()"><div class="item"><span class="nm">${esc(pname(r.p))}</span><b>${r.c} ›</b></div><div class="bar"><div style="width:${r.c/mx*100}%"></div></div></div>`).join('')||`<div class="empty">${L('no_errs_period')}</div>`}
  <button class="btn" onclick="sendStats()">${L('send_bot')}</button>`;
}

function statsText(){
  const list=range(), blocks=[];
  people.forEach(p=>{
    const mine=list.filter(e=>e.p===p.id); if(!mine.length)return;
    const cnt={}; mine.forEach(e=>cnt[e.t]=(cnt[e.t]||0)+1);
    blocks.push(pname(p)+'\n'+Object.keys(cnt).map(t=>tname(t)+' - '+cnt[t]).join('\n'));
  });
  if(!blocks.length) return '';
  return L('period')+': '+periodLabel()+'\n\n'+blocks.join('\n\n');
}
function sendStats(){
  const text=statsText();
  if(!text){toast(L('no_data'));return}
  if(text.length>3900){toast(L('too_much'));return}
  const url='https://t.me/share/url?url=%20&text='+encodeURIComponent(text);
  if(tg&&tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,'_blank');
}
function copyText(text,okMsg){
  const fallback=()=>{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(okMsg)}catch{toast(L('copy_fail'))}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast(okMsg),fallback);
  else fallback();
}

let cb=null;
function ask(msg,fn){cb=fn;modal(`<h3>${esc(msg)}</h3><button class="btn red" onclick="closeModal();cb&&cb()">${L('yes_del')}</button><button class="btn gray" onclick="closeModal()">${L('cancel')}</button>`)}

function askLeave(){confirmBox(L('confirm_leave'),L('yes_leave'),leaveTeam,true)}
async function leaveTeam(){
  team=''; teamOpen=false; types=[];people=[];errs=[];sig='';loadedOnce=false;openId=null;tab='home'; render(); await store.del('team');
}
async function legacyRead(){
  const base=await store.get(['types','ids']);
  let ty=[],ids=[]; try{ty=JSON.parse(base.types||'[]')}catch{} try{ids=JSON.parse(base.ids||'[]')}catch{}
  const data=await store.get(ids.map(i=>'c_'+i));
  const pe=ids.map(i=>{try{return JSON.parse(data['c_'+i])}catch{return null}}).filter(Boolean);
  const keys=[]; pe.forEach(p=>{for(let n=0;n<(p.nc||0);n++)keys.push('e_'+p.id+'_'+n)});
  const ed=await store.get(keys), er=[];
  pe.forEach(p=>{let k=0;for(let n=0;n<(p.nc||0);n++){try{JSON.parse(ed['e_'+p.id+'_'+n]||'[]').forEach(a=>er.push({id:'l_'+p.id+'_'+(k++),p:p.id,t:a[0],ts:a[1]}))}catch{}}});
  return {ty,pe,er};
}
function askMigrate(){confirmBox(L('migrate_confirm'),L('yes_migrate'),doMigrate,false)}
async function doMigrate(){
  try{
    const {ty,pe,er}=await legacyRead();
    if(!ty.length&&!pe.length&&!er.length){toast(L('migrate_none'));return}
    const up=(table,rows)=>api(table+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:body(rows)});
    if(ty.length) await up('types',ty.map(t=>({id:t.id,name:t.name})));
    if(pe.length) await up('people',pe.map(p=>({id:p.id,sur:p.sur||'',nm:p.nm||'',pat:p.pat||'',ini:p.ini||'',phone:p.phone||'',tg:p.tg||''})));
    for(let i=0;i<er.length;i+=500) await up('errs',er.slice(i,i+500));
    toast(L('migrate_done')); sig=''; await refresh();
  }catch(e){console.error(e);toast(L('migrate_fail'))}
}
function delType(id){ask(L('confirm_del_type'),()=>doDelType(id))}
async function doDelType(id){
  const old=tname(id); types=types.filter(t=>t.id!==id); render();
  if(await mutate(()=>api('types?id=eq.'+q(id),{method:'DELETE'}))) logAct('type_del',{name:old});
}

function addPerson(){
  modal(`<h3>${L('new_picker')}</h3>
  <input id="i1" placeholder="${L('surname')}"><input id="i2" placeholder="${L('name')}"><input id="i5" placeholder="${L('patr')}">
  <input id="i3" type="tel" placeholder="${L('phone_ph')}"><input id="i4" placeholder="${L('tg_ph')}">
  <button class="btn" onclick="doAddPerson()">${L('add')}</button><button class="btn gray" onclick="closeModal()">${L('cancel')}</button>`);
}
async function doAddPerson(){
  const v=i=>document.getElementById(i).value.trim();
  if(!v('i1')||!v('i2'))return;
  const p={id:uid(),sur:v('i1'),nm:v('i2'),pat:v('i5'),phone:v('i3'),tg:v('i4')};
  people.push(p); closeModal(); render();
  if(await mutate(()=>api('people',{method:'POST',body:body(p)}))) logAct('person_add',{name:pname(p)});
}
function editPerson(id){
  const p=people.find(x=>x.id===id); if(!p)return;
  modal(`<h3>${L('edit_picker')}</h3>
  <input id="i1" placeholder="${L('surname')}" value="${esc(p.sur||'')}"><input id="i2" placeholder="${L('name')}" value="${esc(p.nm||'')}"><input id="i5" placeholder="${L('patr')}" value="${esc(p.pat||'')}">
  <input id="i3" type="tel" placeholder="${L('phone_ph')}" value="${esc(p.phone||'')}"><input id="i4" placeholder="${L('tg_ph')}" value="${esc(p.tg||'')}">
  <button class="btn" onclick="doEditPerson('${id}')">${L('save')}</button><button class="btn gray" onclick="closeModal()">${L('cancel')}</button>`);
}
async function doEditPerson(id){
  const p=people.find(x=>x.id===id); if(!p)return;
  const v=i=>document.getElementById(i).value.trim();
  if(!v('i1'))return;
  const f={sur:v('i1'),nm:v('i2'),pat:v('i5'),phone:v('i3'),tg:v('i4')}, ch={};
  for(const k in f) if((p[k]||'')!==f[k]) ch[k]=[p[k]||'',f[k]];
  Object.assign(p,f); closeModal(); render();
  if(await mutate(()=>api('people?id=eq.'+q(id),{method:'PATCH',body:body(f)}))){ toast(L('saved')); if(Object.keys(ch).length) logAct('person_edit',{name:pname(p),ch}); }
}
function delErr(id){confirmBox(L('confirm_del_err'),L('yes_del'),()=>doDelErr(id),true)}
async function doDelErr(id){
  const e=errs.find(x=>x.id===id), person=e&&people.find(x=>x.id===e.p);
  const d=e?{picker:person?pname(person):'',type:tname(e.t),ts:e.ts}:null;
  errs=errs.filter(x=>x.id!==id); render();
  if(await mutate(()=>api('errs?id=eq.'+q(id),{method:'DELETE'})) && d) logAct('err_del',d);
}
function delPerson(id){ask(L('confirm_del_picker'),()=>doDelPerson(id))}
async function doDelPerson(id){
  const p=people.find(x=>x.id===id), name=p?pname(p):'', n=errs.filter(e=>e.p===id).length;
  people=people.filter(x=>x.id!==id); errs=errs.filter(e=>e.p!==id); openId=null; render();
  const ok=await mutate(async()=>{
    await api('errs?p=eq.'+q(id),{method:'DELETE'});
    await api('people?id=eq.'+q(id),{method:'DELETE'});
  });
  if(ok) logAct('person_del',{name,n});
}

function addErr(id){
  if(!types.length){modal(`<h3>${L('no_types_title')}</h3><div class="sb" style="margin-bottom:10px">${L('no_types_hint')}</div><button class="btn gray" onclick="closeModal()">${L('ok')}</button>`);return}
  modal(`<h3>${L('pick_type')}</h3>${types.map(t=>`<button class="btn gray" style="margin-bottom:6px" onclick="doAddErr('${id}','${t.id}')">${esc(t.name)}</button>`).join('')}<button class="btn gray" onclick="closeModal()">${L('cancel')}</button>`);
}
async function doAddErr(pid,tid){
  const person=people.find(x=>x.id===pid); if(!person)return;
  const e={id:uid(),p:pid,t:tid,ts:Date.now()};
  errs.push(e); closeModal(); render(); toast(L('err_added')+' '+fmtDT(e.ts));
  if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('warning');
  if(await mutate(()=>api('errs',{method:'POST',body:body(e)}))) logAct('err_add',{picker:pname(person),type:tname(tid)});
}

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  tab=b.dataset.t; openId=null; sel={p:null,t:null}; render();
});

load();
</script>
